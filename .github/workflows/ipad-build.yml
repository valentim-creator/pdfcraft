name: Build PDFCraft iPad App
on:
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente quando quiser

# Remove qualquer conflito com outras automações do repositório original
concurrency:
  group: ipad-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-ipad-app:
    runs-on: macos-latest
    
    steps:
      - name: 1. Baixar o Código do PDFCraft
        uses: actions/checkout@v4

      - name: 2. Configurar ambiente de compilação
        uses: actions/setup-node@v4
        with:
          node-version: '18.17'

      - name: 3. Forçar Instalação Limpa e Gerar Build Estática
        # O 'npm install --legacy-peer-deps' ignora conflitos antigos de travas do projeto
        run: |
          npm install --legacy-peer-deps
          npm run build --if-present || echo "Pulando build opcional"
          
      - name: 4. Criar estrutura do App para iPadOS
        run: |
          mkdir -p PDFCraftApp/Payload/PDFCraft.app
          # Se o projeto gerou uma pasta 'out' ou 'dist', nós envelopamos
          if [ -d "out" ]; then cp -R out/* PDFCraftApp/Payload/PDFCraft.app/; fi
          if [ -d "dist" ]; then cp -R dist/* PDFCraftApp/Payload/PDFCraft.app/; fi
          
      - name: 5. Criar Arquivo de Configuração Apple (Info.plist)
        run: |
          cat <<EOF > PDFCraftApp/Payload/PDFCraft.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>PDFCraft Local</string>
              <key>CFBundleExecutable</key>
              <string>PDFCraft</string>
              <key>CFBundleIdentifier</key>
              <string>com.local.pdfcraft</string>
              <key>CFBundleName</key>
              <string>PDFCraft</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF

      - name: 6. Compactar no formato de instalação (.IPA)
        run: |
          cd PDFCraftApp
          zip -r ../PDFCraft_iPad_Local.ipa Payload
          
      - name: 7. Enviar o Aplicativo Pronto para Você Baixar
        uses: actions/upload-artifact@v4
        with:
          name: ipad-application-package
          path: PDFCraft_iPad_Local.ipa
