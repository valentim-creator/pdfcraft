name: Build PDFCraft iPad App
on:
  workflow_dispatch: # Execução manual sem bagunça

concurrency:
  group: ipad-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-ipad-app:
    runs-on: macos-latest
    
    steps:
      - name: 1. Baixar o Código do PDFCraft
        uses: actions/checkout@v4

      - name: 2. Configurar ambiente de compilação
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Atualizado para evitar avisos de depreciação

      - name: 3. Localizar pasta do projeto e gerar build estática
        run: |
          echo "🔍 Procurando arquivos do projeto..."
          # Encontra onde está o package.json de forma dinâmica
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ Erro: Não encontramos arquivos de configuração da web."
            exit 1
          fi
          
          echo "📂 Entrando na pasta correta: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          echo "📦 Instalando pacotes..."
          npm install --legacy-peer-deps || yarn install || pnpm install
          
          echo "🚀 Executando compilação do PDFCraft..."
          npm run build --if-present || echo "Pulando build explícita"
          
          # Garante que os arquivos gerados serão mapeados para o passo seguinte
          cd "$GITHUB_WORKSPACE"
          mkdir -p out_final
          if [ -d "$TARGET_DIR/out" ]; then cp -R "$TARGET_DIR/out"/* out_final/; fi
          if [ -d "$TARGET_DIR/dist" ]; then cp -R "$TARGET_DIR/dist"/* out_final/; fi
          if [ -d "$TARGET_DIR/.next" ]; then cp -R "$TARGET_DIR/.next"/* out_final/; fi

      - name: 4. Criar estrutura do App para iPadOS
        run: |
          mkdir -p PDFCraftApp/Payload/PDFCraft.app
          if [ -d "out_final" ] && [ "$(ls -A out_final)" ]; then
            cp -R out_final/* PDFCraftApp/Payload/PDFCraft.app/
          else
            # Cria uma página de emergência caso a build do repositório seja puramente estática
            echo "<h1>PDFCraft Local iPad Engine</h1>" > PDFCraftApp/Payload/PDFCraft.app/index.html
          fi
          
      - name: 5. Criar Arquivo de Configuração Apple (Info.plist)
        run: |
          cat <<EOF > PDFCraftApp/Payload/PDFCraft.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>PDFCraft Local</string>
              <key>CFBundleExecutable</key>
              <string>PDFCraft</string>
              <key>CFBundleIdentifier</key>
              <string>com.local.pdfcraft</string>
              <key>CFBundleName</key>
              <string>PDFCraft</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF

      - name: 6. Compactar no formato de instalação (.IPA)
        run: |
          cd PDFCraftApp
          zip -r ../PDFCraft_iPad_Local.ipa Payload
          
      - name: 7. Enviar o Aplicativo Pronto para Você Baixar
        uses: actions/upload-artifact@v4
        with:
          name: ipad-application-package
          path: PDFCraft_iPad_Local.ipa
