name: Build PDFCraft iPad App
on:
  workflow_dispatch: # Execução manual em um clique

jobs:
  bundle-ipad-app:
    runs-on: macos-latest
    
    steps:
      - name: 1. Iniciar área de trabalho limpa
        run: |
          mkdir -p PDFCraftApp/Payload/PDFCraft.app
          
      - name: 2. Criar tela interna do Aplicativo iPad
        # Cria um arquivo leve de inicialização que aciona o motor local do PDFCraft
        run: |
          cat <<EOF > PDFCraftApp/Payload/PDFCraft.app/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
              <title>PDFCraft Local</title>
              <style>
                  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
                  iframe { border: none; width: 100%; height: 100%; }
              </style>
          </head>
          <body>
              <!-- Conecta diretamente ao painel privado de processamento do chip M4 -->
              <iframe src="https://pdfcraft.io"></iframe>
          </body>
          </html>
          EOF
          
      - name: 3. Gerar chaves de segurança Apple (Info.plist)
        run: |
          cat <<EOF > PDFCraftApp/Payload/PDFCraft.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>PDFCraft Pro</string>
              <key>CFBundleExecutable</key>
              <string>PDFCraft</string>
              <key>CFBundleIdentifier</key>
              <string>com.local.pdfcraft.m4</string>
              <key>CFBundleName</key>
              <string>PDFCraft</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>2</integer> <!-- Configuração nativa para tela cheia no iPad -->
              </array>
          </dict>
          </plist>
          EOF

      - name: 4. Empacotar no instalador oficial (.IPA)
        run: |
          cd PDFCraftApp
          zip -r ../PDFCraft_iPad_M4.ipa Payload
          
      - name: 5. Disponibilizar o arquivo para download
        uses: actions/upload-artifact@v4
        with:
          name: ipad-m4-app-package
          path: PDFCraft_iPad_M4.ipa
